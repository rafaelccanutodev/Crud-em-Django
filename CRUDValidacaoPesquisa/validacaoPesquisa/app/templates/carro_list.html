<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

{% extends 'base.html'%}
{% block title %}
Cadastro de veiculos
{% endblock title %}


{% block content %}

    <form method="GET" action="">
    <input type="text" name="busca" placeholder="Buscar modelo..." value="{{ request.GET.busca }}">
    <button type="submit" class="btn btn-primary">Buscar</button>
</form>
    <table>
        <thead>
            <tr>
                <th>Modelo</th>
                <th>Marca</th>
                <th>Ano</th>
                <th>Acao</th>
        </tr>
        </thead>
        <tbody>
        {% for carro in lista%}
        <tr>
            <td>{{ carro.modelo}}</td>
            <td>{{ carro.marca }}</td>
            <td>{{carro.ano}}</td>
            <td>
               <a href="{% url 'editar_carro' carro.id %}">
                   <i class="material-icons">mode_edit</i>
               </a>
                <a href="{% url 'deletar_carro' carro.id %}">
                <i class="material-icons">delete</i>
                </a>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'cadastrar_carro' %}" class="btn btn-primary">Cadastrar</a>

{% endblock %}
